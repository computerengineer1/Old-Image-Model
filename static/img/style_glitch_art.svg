<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 60" width="120" height="60">
  <rect width="120" height="60" fill="#0c0c14"/>
  <!-- displaced slices of a "photo" -->
  <g>
    <rect x="0" y="4" width="120" height="10" fill="#3a5a8c"/>
    <rect x="0" y="14" width="120" height="8" fill="#8c5a3a"/>
    <rect x="0" y="22" width="120" height="12" fill="#5a8c6a"/>
    <rect x="0" y="34" width="120" height="9" fill="#7a4a8c"/>
    <rect x="0" y="43" width="120" height="13" fill="#2a3a5c"/>
  </g>
  <!-- glitch offsets -->
  <g>
    <rect x="18" y="14" width="40" height="8" fill="#4de3ff" opacity="0.8"/>
    <rect x="52" y="14" width="40" height="8" fill="#ff2e88" opacity="0.65"/>
    <rect x="8" y="34" width="60" height="9" fill="#4de3ff" opacity="0.55"/>
    <rect x="60" y="34" width="52" height="9" fill="#ff2e88" opacity="0.5"/>
    <rect x="30" y="22" width="26" height="12" fill="#f0f0f0" opacity="0.85"/>
    <rect x="86" y="4" width="20" height="10" fill="#101018"/>
    <rect x="88" y="6" width="20" height="10" fill="#ffd23e" opacity="0.7"/>
  </g>
  <!-- pixel sort streaks -->
  <g opacity="0.9">
    <rect x="0" y="47" width="14" height="2" fill="#4de3ff"/>
    <rect x="20" y="50" width="30" height="2" fill="#ff2e88"/>
    <rect x="60" y="46" width="22" height="2" fill="#f0f0f0"/>
    <rect x="90" y="52" width="26" height="2" fill="#4de3ff"/>
    <rect x="44" y="54" width="18" height="2" fill="#ffd23e"/>
  </g>
  <!-- jpeg blocks -->
  <g fill="none" stroke="#000000" stroke-opacity="0.4" stroke-width="1">
    <rect x="8" y="8" width="8" height="8"/><rect x="40" y="26" width="8" height="8"/>
    <rect x="72" y="10" width="8" height="8"/><rect x="96" y="38" width="8" height="8"/>
  </g>
</svg>
