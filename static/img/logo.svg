<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="omBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1826"/>
      <stop offset="1" stop-color="#0d0b10"/>
    </linearGradient>
    <linearGradient id="omRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5a623"/>
      <stop offset="1" stop-color="#ff2e88"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#omBg)" stroke="url(#omRing)" stroke-width="2.5"/>
  <!-- pixel aperture -->
  <g shape-rendering="crispEdges">
    <rect x="20" y="16" width="8" height="8" fill="#f5a623"/>
    <rect x="28" y="16" width="8" height="8" fill="#ffca6b"/>
    <rect x="36" y="16" width="8" height="8" fill="#f5a623"/>
    <rect x="16" y="24" width="8" height="8" fill="#ff7a3d"/>
    <rect x="40" y="24" width="8" height="8" fill="#ff2e88"/>
    <rect x="16" y="32" width="8" height="8" fill="#ff2e88"/>
    <rect x="40" y="32" width="8" height="8" fill="#ff77b3"/>
    <rect x="20" y="40" width="8" height="8" fill="#ff2e88"/>
    <rect x="28" y="40" width="8" height="8" fill="#45e0d8"/>
    <rect x="36" y="40" width="8" height="8" fill="#ff2e88"/>
  </g>
  <rect x="26" y="26" width="12" height="12" fill="#0d0b10" stroke="#45e0d8" stroke-width="2"/>
  <rect x="30" y="30" width="4" height="4" fill="#45e0d8"/>
  <!-- scanlines -->
  <g opacity="0.35" shape-rendering="crispEdges">
    <rect x="4" y="10" width="56" height="1" fill="#ffffff" opacity="0.15"/>
    <rect x="4" y="22" width="56" height="1" fill="#ffffff" opacity="0.15"/>
    <rect x="4" y="34" width="56" height="1" fill="#ffffff" opacity="0.15"/>
    <rect x="4" y="46" width="56" height="1" fill="#ffffff" opacity="0.15"/>
  </g>
</svg>
