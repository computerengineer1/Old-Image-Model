    <line x1="60" y1="34" x2="34" y2="60"/><line x1="60" y1="34" x2="60" y2="60"/>
    <line x1="60" y1="34" x2="86" y2="60"/><line x1="60" y1="34" x2="114" y2="60"/>
    <line x1="60" y1="34" x2="150" y2="60"/>
  </g>
  <g stroke="#45e0d8" stroke-width="0.8" opacity="0.8">
    <line x1="0" y1="38" x2="120" y2="38"/><line x1="0" y1="43.5" x2="120" y2="43.5"/>
    <line x1="0" y1="50.5" x2="120" y2="50.5"/><line x1="0" y1="59" x2="120" y2="59"/>
  </g>
  <!-- stars -->
  <g fill="#ffffff" opacity="0.8">
