<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 60" width="120" height="60">
  <defs>
    <linearGradient id="swSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16082e"/>
      <stop offset="0.55" stop-color="#5c1a5e"/>
      <stop offset="1" stop-color="#ff5a7a"/>
    </linearGradient>
    <linearGradient id="swSun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23e"/>
      <stop offset="1" stop-color="#ff2e88"/>
