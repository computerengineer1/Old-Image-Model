<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 60" width="120" height="60">
  <defs>
    <filter id="dream" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045 0.07" numOctaves="3" seed="7" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="14" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="eaBg" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#3a2a5e"/>
      <stop offset="1" stop-color="#0e0a18"/>
    </radialGradient>
  </defs>
  <rect width="120" height="60" fill="url(#eaBg)"/>
  <g filter="url(#dream)">
    <circle cx="42" cy="26" r="13" fill="#c86ad8" opacity="0.8"/>
    <circle cx="74" cy="34" r="16" fill="#5a8ad8" opacity="0.7"/>
    <ellipse cx="58" cy="28" rx="9" ry="5" fill="#e8c86a" opacity="0.75"/>
    <circle cx="90" cy="16" r="7" fill="#6ad8a8" opacity="0.6"/>
    <circle cx="24" cy="46" r="9" fill="#d86a7a" opacity="0.55"/>
  </g>
  <!-- fractal eyes -->
  <g opacity="0.9">
    <ellipse cx="40" cy="24" rx="5" ry="3" fill="#f0e8d0"/>
    <circle cx="40" cy="24" r="1.6" fill="#101018"/>
    <ellipse cx="76" cy="32" rx="6" ry="3.4" fill="#f0e8d0"/>
    <circle cx="76" cy="32" r="1.8" fill="#101018"/>
    <ellipse cx="58" cy="44" rx="4" ry="2.4" fill="#f0e8d0" opacity="0.7"/>
    <circle cx="58" cy="44" r="1.2" fill="#101018" opacity="0.7"/>
  </g>
  <rect width="120" height="60" fill="#8a5ad8" opacity="0.06"/>
</svg>
